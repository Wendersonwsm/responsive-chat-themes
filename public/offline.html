<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FinWise — Sem conexão</title>
  <meta name="theme-color" content="#2563eb" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    body{background:linear-gradient(160deg,#eef2ff 0%,#f5f6fa 60%,#fef2f2 100%);color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:420px;background:rgba(255,255,255,0.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.6);border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 20px 50px -20px rgba(15,23,42,0.25)}
    .icon{width:72px;height:72px;border-radius:24px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 14px 30px -10px rgba(37,99,235,0.55)}
    .icon svg{width:36px;height:36px}
    h1{font-size:22px;margin:0 0 8px;font-weight:800;letter-spacing:-0.02em}
    p{margin:0 0 24px;color:#475569;font-size:14px;line-height:1.55}
    .status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fee2e2;color:#b91c1c;margin-bottom:18px}
    .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1.6s ease-in-out infinite}
    .status.online{background:#dcfce7;color:#166534}
    .status.online .dot{background:#22c55e;animation:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    button{appearance:none;border:0;cursor:pointer;width:100%;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 10px 24px -8px rgba(37,99,235,0.5);transition:transform .15s ease}
    button:active{transform:scale(.97)}
    .hint{margin-top:14px;font-size:12px;color:#64748b}
    @media (prefers-color-scheme: dark){
      body{background:linear-gradient(160deg,#0b1220 0%,#0f172a 60%,#1a0f1f 100%);color:#f1f5f9}
      .card{background:rgba(15,23,42,0.7);border-color:rgba(255,255,255,0.08)}
      p{color:#94a3b8}.hint{color:#64748b}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/>
      </svg>
    </div>
    <span id="status" class="status"><span class="dot"></span><span id="status-text">Sem conexão</span></span>
    <h1>Você está offline</h1>
    <p>Não conseguimos carregar novos dados agora. Verifique sua conexão com a internet — assim que voltar, seus dados serão sincronizados automaticamente.</p>
    <button id="retry" type="button">Tentar novamente</button>
    <div class="hint">O FinWise continua disponível e seus dados locais estão seguros.</div>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const btn = document.getElementById('retry');
    function update(){
      if(navigator.onLine){
        statusEl.classList.add('online');
        statusText.textContent = 'Conexão restabelecida';
        btn.textContent = 'Voltar ao app';
      } else {
        statusEl.classList.remove('online');
        statusText.textContent = 'Sem conexão';
        btn.textContent = 'Tentar novamente';
      }
    }
    window.addEventListener('online', () => { update(); location.replace('/'); });
    window.addEventListener('offline', update);
    btn.addEventListener('click', () => { location.replace('/'); });
    update();
  </script>
</body>
</html>
